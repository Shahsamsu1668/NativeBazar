<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="basketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="pumpkinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="tomatoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="eggplantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="carrotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGrad)"/>
  
  <!-- Subtle agricultural background pattern circles -->
  <circle cx="200" cy="150" r="130" fill="#ecfdf5" opacity="0.8"/>
  <circle cx="200" cy="150" r="105" fill="#f0fdf4" opacity="0.6"/>

  <g filter="url(#shadow)">
    <!-- Behind Leaves / Greens -->
    <path d="M140 120 C120 70, 160 50, 175 90 C190 60, 230 75, 215 110" fill="url(#leafGrad)"/>
    <path d="M220 115 C240 60, 275 80, 260 115" fill="#16a34a"/>
    <path d="M125 130 C100 90, 130 80, 145 115" fill="#15803d"/>

    <!-- Pumpkin Left -->
    <ellipse cx="160" cy="130" rx="36" ry="32" fill="url(#pumpkinGrad)"/>
    <ellipse cx="150" cy="130" rx="18" ry="30" fill="#f97316" opacity="0.7"/>
    <path d="M160 100 Q162 90, 168 88" stroke="#15803d" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Eggplant Center-Right -->
    <path d="M225 105 C245 105, 260 125, 255 145 C250 160, 230 165, 215 155 C205 145, 210 115, 225 105 Z" fill="url(#eggplantGrad)"/>
    <path d="M225 105 Q228 95, 224 88" stroke="#16a34a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M220 104 L228 102 L230 108 L222 109 Z" fill="#16a34a"/>

    <!-- Carrots -->
    <path d="M185 110 L210 160 L195 162 Z" fill="url(#carrotGrad)"/>
    <path d="M185 110 Q180 95, 176 90 M186 108 Q187 93, 192 88" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Tomatoes in Front -->
    <circle cx="185" cy="150" r="22" fill="url(#tomatoGrad)"/>
    <path d="M185 128 L183 133 L188 133 Z M180 131 L185 133 M190 131 L185 133" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>

    <circle cx="218" cy="154" r="18" fill="url(#tomatoGrad)"/>
    <path d="M218 136 L216 140 L220 140 Z" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>

    <!-- Front Green Chili -->
    <path d="M140 155 Q160 170, 180 162 Q160 164, 140 155" fill="#16a34a"/>
    <path d="M138 153 Q132 150, 130 152" stroke="#15803d" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Woven Harvest Basket Body -->
    <path d="M115 145 L135 220 Q200 232, 265 220 L285 145 Q200 135, 115 145 Z" fill="url(#basketGrad)"/>
    
    <!-- Basket Rim -->
    <path d="M110 144 Q200 135, 290 144 Q200 152, 110 144 Z" fill="#78350f"/>
    <path d="M110 144 Q200 137, 290 144" stroke="#d97706" stroke-width="2" fill="none"/>

    <!-- Woven Basket Weave Lines -->
    <path d="M130 155 Q200 165, 270 155 M132 175 Q200 185, 268 175 M135 195 Q200 205, 265 195" stroke="#78350f" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M145 150 L152 222 M175 147 L180 226 M200 146 L200 227 M225 147 L220 226 M255 150 L248 222" stroke="#d97706" stroke-width="1.8" fill="none" opacity="0.5"/>
  </g>

  <!-- Clean Bottom Label -->
  <rect x="120" y="248" width="160" height="26" rx="13" fill="#065f46" opacity="0.95"/>
  <text x="200" y="265" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    FRESH FARM CROP
  </text>
</svg>

